<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Attendance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main-container">
  <h2>Attendance Report</h2>
  <button onclick="loadReport()" class="dashboard-btn" style="border: 1px solid var(--border-light); background: var(--color-primary); color: white;">View Report</button>

  <br><br>

  <div class="table-container">
    <table id="reportTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Roll No</th>
          <th>Status</th>
          <th>Date</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
</div>

<script>
// =====================
// LOAD ATTENDANCE REPORT
// =====================
async function loadReport() {
  try {
    const res = await fetch("/attendance-report");
    const records = await res.json();

    const tbody = document.querySelector("#reportTable tbody");
    tbody.innerHTML = "";

    if (records.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" style="text-align:center;">
            No attendance records found
          </td>
        </tr>
      `;
      return;
    }

    records.forEach(record => {
      tbody.innerHTML += `
        <tr>
          <td>${record.student ? record.student.name : ""}</td>
          <td>${record.student ? record.student.rollNo : ""}</td>
          <td>${record.status}</td>
          <td>${new Date(record.date).toLocaleDateString()}</td>
          <td>
            <button onclick="deleteAttendance('${record._id}')">
              Delete
            </button>
          </td>
        </tr>
      `;
    });

  } catch (error) {
    alert("Error loading report");
  }
}

// =====================
// DELETE ATTENDANCE
// =====================
async function deleteAttendance(id) {
  const res = await fetch("/delete-attendance/" + id, {
    method: "DELETE"
  });

  const data = await res.json();
  alert(data.message);
  loadReport();
}
</script>
</body>
</html>
